name: pr-ci

# Normal PR CI — CANLI BORSA YOK: derleme + test + analiz (deterministik).
# Canlı testnet order akışı AYRI workflow: testnet-e2e.yml (yalnız manual).
# KURAL: her adım gerçek geçiş — continue-on-error / || true YASAK.

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Incremental OFF: cache-ler arası deterministik
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable + rustfmt/clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 1) fmt
        run: cargo fmt --all -- --check

      - name: 2) check (all targets, all features)
        run: cargo check --workspace --all-targets --all-features

      - name: 3) clippy — HARD GATE (-D warnings, suppression YASAK)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 4) test
        run: cargo test --workspace --all-targets --all-features

      - name: 5) debug build (all targets)
        run: cargo build --workspace --all-targets --all-features

      - name: 6) release build
        run: cargo build --release --workspace --all-features
