name: testnet-e2e

# MANUEL workflow — gerçek testnet order akışını denetler.
# KURALLAR:
#   * Yalnız elle dispatch (workflow_dispatch) — normal PR CI'da ASLA koşmaz.
#   * Yalnız TESTNET. Mainnet URL/secret girilirse job başlamadan DÜŞER.
#   * Küçük kontrollü order → acele → iptal → restore-doğrulama → cleanup.
#   * Timeout + recovery: her adım kendi timeout'una bağlı, sarkmaz.

on:
  workflow_dispatch:
    inputs:
      confirm_testnet:
        description: '"TESTNET" yazın (doğrulama)'
        required: true
        default: 'TESTNET'

env:
  # DEPOLAMA: CH localhost arşiv — job başında sağlık kontrolü.
  CLICKHOUSE_URL: http://localhost:8123

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: mainnet-tehlike-kapisi
        run: |
          set -euo pipefail
          echo '::echo::on'
          if [ "${{ github.event.inputs.confirm_testnet }}" != "TESTNET" ]; then
            echo "confirm_testnet='TESTNET' olmalı — job durduruldu"; exit 1
          fi
          # Ortam değişkenlerinde MAINNET izi YOK — başlamadan önce kanıtla
          for v in HL_MAINNET_URL MAINNET_URL MAINNET_API_URL; do
            val="${!v:-}"
            if [ -n "$val" ]; then
              echo "TEHLİKE: ${v} tanımlı — mainnet config izi! Job başlamaz."; exit 1
            fi
          done
          # Secret değerlerinde mainnet uç adresi kontrolü
          if echo "$API_URL" "$WS_URL" | grep -qiE "mainnet|api\.hyperliquid\.xyz"; then
            echo "TEHLİKE: secret mainnet görünümü taşıyor — job başlamaz."; exit 1
          fi
          # URL FORMAT DENETİMİ — secret'a tırnak/boşluk/eksik şema girilirse
          # probe 'HTTP 0: builder error' ile belirsiz düşer; burada net mesaj:
          # uzunluk çözümlemesi (değer YAZDIRILMAZ — yalnız biçim kanıtı).
          api_trimmed="$(echo "$API_URL" | tr -d '[:space:]')"
          ws_trimmed="$(echo "$WS_URL" | tr -d '[:space:]')"
          if [ "${#api_trimmed}" -ne "${#API_URL}" ] || [ "${#ws_trimmed}" -ne "${#WS_URL}" ]; then
            echo "HATA: API_URL/WS_URL secret'ında BOŞLUK/satır sonu var — tırnak ve boşluk olmadan yeniden gir."; exit 1
          fi
          case "$API_URL" in
            https://*) echo "API_URL şema OK (https://) — uzunluk ${#API_URL}" ;;
            *) echo "HATA: API_URL 'https://' ile başlamalı (girilen uzunluk ${#API_URL})"; exit 1 ;;
          esac
          case "$WS_URL" in
            wss://*) echo "WS_URL şema OK (wss://) — uzunluk ${#WS_URL}" ;;
            *) echo "HATA: WS_URL 'wss://' ile başlamalı (girilen uzunluk ${#WS_URL})"; exit 1 ;;
          esac
          case "$TESTNET_API_WALLET_SECRET" in
            ""|*" "*) echo "HATA: TESTNET_API_WALLET_SECRET boş veya boşluklu"; exit 1 ;;
            *[!0-9a-fA-F0x]*|0b*|0o*) echo "HATA: private key 64 hex karakter olmalı (uzunluk ${#TESTNET_API_WALLET_SECRET})"; exit 1 ;;
          esac
          # 66 = '0x' + 64 hex (kullanıcı dostu) → smoke adımında soyulur.
          if [ "${#TESTNET_API_WALLET_SECRET}" -ne 64 ] && [ "${#TESTNET_API_WALLET_SECRET}" -ne 66 ]; then
            echo "HATA: private key uzunluğu ${#TESTNET_API_WALLET_SECRET} — 64 hex olmalı (0x'li veya 0x'siz)"; exit 1
          fi
          case "$TESTNET_API_WALLET_ADDRESS" in
            0x*) echo "ADDRESS şema OK — uzunluk ${#TESTNET_API_WALLET_ADDRESS}" ;;
            *) echo "HATA: TESTNET_API_WALLET_ADDRESS '0x' ile başlamalı (uzunluk ${#TESTNET_API_WALLET_ADDRESS})"; exit 1 ;;
          esac
          echo 'KAPI OK: yalnız testnet + secret formatı geçerli.'
        env:
          API_URL: ${{ secrets.API_URL }}
          WS_URL: ${{ secrets.WS_URL }}
          TESTNET_API_WALLET_SECRET: ${{ secrets.TESTNET_API_WALLET_SECRET }}
          TESTNET_API_WALLET_ADDRESS: ${{ secrets.TESTNET_API_WALLET_ADDRESS }}
  e2e:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Depo başlat (CH arşiv)
        run: docker run -d --name ch -p 127.0.0.1:8123:8123 clickhouse/clickhouse-server:25.8-alpine
      - name: Build
        run: cargo build --release --workspace
        timeout-minutes: 15
      # GERÇEK order akışı: probe_smoke testnet'te küçük limit order
      # yerleştirir → açık listede doğrular → iptal eder → iptali doğrular
      # → pozisyon FLAT doğrular. Her adım exit-code ile kanıtlanır.
      - name: Smoke order + cancel (testnet)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # '0x' önekli girilen key'i soy (66 → 64 hex; Config 0x'siz ister)
          export HYPERLIQUID_PRIVATE_KEY="${HYPERLIQUID_PRIVATE_KEY#0x}"
          TESTNET=1 ./target/release/probe_smoke SUI 20
        env:
          TESTNET: '1'
          NETWORK: testnet
          HYPERLIQUID_API_URL: ${{ secrets.API_URL }}
          HYPERLIQUID_WS_URL: ${{ secrets.WS_URL }}
          HYPERLIQUID_PRIVATE_KEY: ${{ secrets.TESTNET_API_WALLET_SECRET }}
          API_WALLET_ADDRESS: ${{ secrets.TESTNET_API_WALLET_ADDRESS }}
          # Master (fon tutan) adres — ayrı agent wallet kullanıldıysa
          # TESTNET_USER_ADDRESS girilir; yoksa API wallet adresi kullanılır
          # (anahtar doğrudan cüzdan anahtarıysa aynıdır).
          USER_ADDRESS: ${{ secrets.TESTNET_USER_ADDRESS || secrets.TESTNET_API_WALLET_ADDRESS }}
