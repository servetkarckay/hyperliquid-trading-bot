name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tek test adımı: `cargo test --workspace`. Test sayısı bu
      # çıktının logundan raporlanır; ikinci bir `cargo test` koşulmaz.
      - name: Run tests
        run: cargo test --workspace
      # Release build kanıtı: üretim binary'si derlenebilir (cargo test
      # debug'a bakar; release optimize/LTO yolu ayrı kanıt ister).
      - name: Release build
        run: cargo build --release --workspace