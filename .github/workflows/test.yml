name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Tek test adımı. İş emri komutu BİREBİR bu: `cargo test --workspace`
      # (--release yok). Test sayısı bu çıktının logundan raporlanır; ikinci
      # bir `cargo test` çalıştırılmaz.
      - name: Run tests
        run: cargo test --workspace